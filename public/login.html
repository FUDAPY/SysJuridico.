<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<title>Acceso Seguro - SysJurídico</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<link rel="icon" type="image/x-icon" href="/img/logo.ico" />
<link rel="icon" type="image/jpeg" href="/img/logo.jpg" />
<link rel="stylesheet" href="/css/styles.css" />
<style>
  html, body { height: 100%; }
  body {
    margin: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    font-family: var(--fuente-cuerpo);
    background: radial-gradient(circle at top right, #16283f 0%, #0d1b2a 100%);
    position: relative;
    overflow: hidden;
  }
  .circulo-fondo {
    position: absolute;
    width: 600px;
    height: 600px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(37, 99, 235, 0.15) 0%, transparent 70%);
    top: -200px;
    right: -200px;
    pointer-events: none;
  }
  .circulo-fondo-2 {
    position: absolute;
    width: 500px;
    height: 500px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(201, 162, 39, 0.12) 0%, transparent 70%);
    bottom: -150px;
    left: -150px;
    pointer-events: none;
  }
  .caja-login {
    background: var(--bg-card);
    border: 1px solid var(--borde);
    border-radius: 24px;
    padding: 42px 36px;
    width: 100%;
    max-width: 420px;
    box-shadow: 0 30px 80px -20px rgba(0, 0, 0, 0.65);
    position: relative;
    z-index: 10;
  }
  .caja-login .logo {
    width: 82px;
    height: 82px;
    object-fit: cover;
    border-radius: 20px;
    display: block;
    margin: 0 auto 16px;
    box-shadow: 0 8px 24px rgba(0, 0, 0, 0.35);
    border: 2px solid var(--dorado);
  }
  .caja-login h1 {
    font-family: var(--fuente-titulos);
    color: var(--texto);
    font-size: 1.6rem;
    text-align: center;
    margin: 0 0 4px;
    letter-spacing: -0.02em;
    font-weight: 800;
  }
  .caja-login .sub {
    text-align: center;
    color: var(--dorado);
    font-size: 0.75rem;
    font-weight: 700;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    margin: 0 0 20px;
  }
  .caja-login p.intro {
    color: var(--texto-muted);
    font-size: 0.88rem;
    text-align: center;
    margin: 0 0 24px;
  }
  .caja-login label { display: block; margin-bottom: 6px; }
  .caja-login input { margin-bottom: 16px; }
  .caja-login button { width: 100%; margin-top: 8px; }
  .error {
    background: var(--rojo-bg);
    color: var(--rojo-texto);
    border: 1px solid rgba(239, 68, 68, 0.2);
    border-radius: 10px;
    padding: 10px;
    font-size: 0.85rem;
    margin-bottom: 14px;
    display: none;
    text-align: center;
  }
  .pie {
    text-align: center;
    margin-top: 24px;
    font-size: 0.74rem;
    color: var(--texto-muted);
    line-height: 1.6;
    border-top: 1px solid var(--borde);
    padding-top: 14px;
  }
</style>
</head>
<body>
  <div class="circulo-fondo"></div>
  <div class="circulo-fondo-2"></div>

  <div class="caja-login">
    <img class="logo" src="/img/logo.jpg" alt="LIN GROUP & Asociados" onerror="this.src='/877114.jpg'" />
    <h1>LIN GROUP</h1>
    <div class="sub">Asociados &bull; SysJurídico</div>
    <p class="intro">Ingrese sus credenciales corporativas para acceder al despacho digital</p>
    
    <div class="error" id="mensajeError"></div>

    <label>Correo Electrónico</label>
    <input type="email" id="email" placeholder="abogado@lingroup.com" />
    
    <label>Contraseña</label>
    <input type="password" id="password" placeholder="••••••••" />
    
    <button class="btn-primario" onclick="iniciarSesion()">
      <span>🔐</span> Ingresar al Despacho
    </button>
    
    <div class="pie">
      LIN GROUP &amp; Asociados &bull; Asunción &bull; CDE<br />
      Todos los derechos reservados &bull; Sistema creado e impulsado por <a href="https://dev.grupooh.online/" target="_blank" rel="noopener noreferrer" style="color:var(--azul-claro); font-weight:600; text-decoration:none;">Otelax Dev</a> (<a href="https://dev.grupooh.online/" target="_blank" rel="noopener noreferrer" style="color:var(--dorado); text-decoration:none;">www.dev.grupooh.online</a>)
    </div>
  </div>

  <script src="/js/api.js"></script>
  <script>
    async function iniciarSesion() {
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const mensajeError = document.getElementById('mensajeError');
      mensajeError.style.display = 'none';

      try {
        const respuesta = await fetch(`${API_BASE}/auth/login`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password }),
        });
        const json = await respuesta.json();
        if (!respuesta.ok) throw new Error(json.message || 'Credenciales inválidas.');

        localStorage.setItem('token', json.token);
        localStorage.setItem('usuario', JSON.stringify(json.usuario));
        window.location.href = '/index.html';
      } catch (err) {
        mensajeError.textContent = err.message;
        mensajeError.style.display = 'block';
      }
    }

    document.getElementById('password').addEventListener('keydown', (e) => {
      if (e.key === 'Enter') iniciarSesion();
    });
  </script>
</body>
</html>
