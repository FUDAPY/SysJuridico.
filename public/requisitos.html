<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<title>Requisitos y Trámites - SysJuridico</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<link rel="icon" type="image/x-icon" href="/img/logo.ico" />
<link rel="icon" type="image/jpeg" href="/img/logo.jpg" />
<link rel="stylesheet" href="/css/styles.css" />
</head>
<body>
  <div class="barra-lateral" id="barra-lateral"></div>

  <div class="contenido">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:16px">
      <h2>Requisitos y Trámites</h2>
      <button class="btn-primario" data-admin onclick="abrirModalRequisito()">+ Nuevo requisito</button>
    </div>

    <div class="tarjeta">
      <input id="buscador" placeholder="Buscar por título o categoría..." oninput="pintarTabla()" />
    </div>

    <div class="tarjeta">
      <table>
        <thead><tr><th>Título</th><th>Categoría</th><th>Costo</th><th>Requisitos</th><th>Acciones</th></tr></thead>
        <tbody id="tablaRequisitos"></tbody>
      </table>
    </div>
  </div>

  <div class="modal-fondo oculto" id="modalRequisito">
    <div class="modal" style="max-width:560px">
      <h3 id="tituloModalRequisito">Nuevo requisito</h3>
      <input type="hidden" id="requisitoId" />
      <label>Título</label>
      <input id="rqTitulo" placeholder="Ej: Apostillado, Poder, Visa..." />
      <label style="margin-top:10px">Categoría</label>
      <input id="rqCategoria" placeholder="Ej: Legal, Migración..." />
      <label style="margin-top:10px">Costo (Gs.)</label>
      <input type="number" id="rqCosto" min="0" />
      <label style="margin-top:10px">Requisitos / Detalle</label>
      <textarea id="rqRequisitos" rows="6" placeholder="Detallar los requisitos necesarios..."></textarea>
      <div style="display:flex; gap:10px; margin-top:16px">
        <button class="btn-primario" onclick="guardarRequisito()">Guardar</button>
        <button class="btn-secundario" onclick="cerrarModalRequisito()">Cancelar</button>
      </div>
    </div>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/requisitos.js"></script>
</body>
</html>
