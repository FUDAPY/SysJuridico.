<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<title>Créditos / Cobranzas - SysJurídico</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<link rel="icon" type="image/x-icon" href="/img/logo.ico" />
<link rel="icon" type="image/jpeg" href="/img/logo.jpg" />
<link rel="stylesheet" href="/css/styles.css" />
</head>
<body>
  <div class="barra-lateral" id="barra-lateral"></div>

  <div class="contenido">
    <div class="topbar-operativa">
      <div class="topbar-titulo">
        <h2>Créditos y Cobranzas</h2>
        <div class="topbar-subtitulo">Gestión de cartera, saldos de honorarios y registro de amortizaciones</div>
      </div>
      <div class="topbar-acciones">
        <button class="btn-primario" data-admin onclick="abrirModalCredito()">
          <span>+</span> Nuevo Crédito
        </button>
      </div>
    </div>

    <div class="tarjeta" style="padding:14px 20px">
      <input id="buscador" placeholder="🔍 Buscar crédito por cliente, carátula de expediente o concepto..." oninput="pintarTabla()" />
    </div>

    <div class="tarjeta">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:12px">
        <h3 style="margin:0">Cartera de Cobros</h3>
        <span style="font-size:0.82rem; color:var(--texto-muted)">Saldos calculados en Guaraníes (Gs.)</span>
      </div>
      <div style="overflow-x:auto">
        <table>
          <thead>
            <tr>
              <th>Cliente Titular</th>
              <th>Expediente Vinculado</th>
              <th>Concepto</th>
              <th>Monto Total</th>
              <th>Saldo Pendiente</th>
              <th>Estado</th>
              <th style="text-align:right">Acciones</th>
            </tr>
          </thead>
          <tbody id="tablaCreditos"></tbody>
        </table>
      </div>
    </div>
  </div>

  <!-- Modal Nuevo / Editar Crédito -->
  <div class="modal-fondo oculto" id="modalCredito">
    <div class="modal">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:16px">
        <h3 id="tituloModalCredito" style="margin:0">Nuevo Crédito</h3>
        <button onclick="cerrarModalCredito()" style="background:transparent; border:none; font-size:1.3rem; cursor:pointer; color:var(--texto-muted)">&times;</button>
      </div>
      <input type="hidden" id="creditoId" />
      
      <label>Cliente Titular</label>
      <select id="crCliente"></select>
      
      <label style="margin-top:12px">Expediente Asociado</label>
      <select id="crExpediente"><option value="">— Sin expediente asociado —</option></select>
      
      <label style="margin-top:12px">Concepto del Crédito</label>
      <input id="crConcepto" placeholder="Ej: Saldo de honorarios / Gastos judiciales" />
      
      <div style="display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-top:12px">
        <div>
          <label>Monto Total (Gs.)</label>
          <input type="number" id="crMontoTotal" min="0" placeholder="Ej: 3000000" />
        </div>
        <div>
          <label>Saldo Pendiente (Gs.)</label>
          <input type="number" id="crSaldoPendiente" min="0" placeholder="Ej: 3000000" />
        </div>
      </div>
      
      <div style="display:flex; justify-content:flex-end; gap:10px; margin-top:20px">
        <button class="btn-secundario" onclick="cerrarModalCredito()">Cancelar</button>
        <button class="btn-primario" onclick="guardarCredito()">Guardar Registro</button>
      </div>
    </div>
  </div>

  <!-- Modal Registrar Cobro -->
  <div class="modal-fondo oculto" id="modalCobro">
    <div class="modal" style="max-width:480px">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:14px">
        <h3 style="margin:0">Registrar Pago / Cobro</h3>
        <button onclick="cerrarModalCobro()" style="background:transparent; border:none; font-size:1.3rem; cursor:pointer; color:var(--texto-muted)">&times;</button>
      </div>
      <div id="cobroInfo" style="background:var(--bg-subtle); border:1px solid var(--borde); border-radius:12px; padding:12px; font-size:0.88rem; margin-bottom:14px"></div>
      
      <label>Monto a Cobrar (Gs.)</label>
      <input type="number" id="cbMonto" min="0" placeholder="Monto del pago" />
      
      <label style="margin-top:12px">Fecha del Cobro</label>
      <input type="date" id="cbFecha" />
      
      <label style="margin-top:12px">Método de Pago</label>
      <select id="cbMetodo">
        <option value="efectivo">Efectivo</option>
        <option value="transferencia">Transferencia Bancaria (SIPAP)</option>
        <option value="tarjeta">Tarjeta de Débito / Crédito</option>
        <option value="cheque">Cheque</option>
        <option value="otro">Otro</option>
      </select>
      
      <label style="margin-top:12px">Observaciones / Nota</label>
      <input id="cbNota" placeholder="Ej: Pago de cuota 2 según acuerdo" />
      
      <div style="display:flex; justify-content:flex-end; gap:10px; margin-top:20px">
        <button class="btn-secundario" onclick="cerrarModalCobro()">Cancelar</button>
        <button class="btn-primario" onclick="confirmarCobro()">Confirmar e Imprimir</button>
      </div>
    </div>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/creditos.js"></script>
</body>
</html>
