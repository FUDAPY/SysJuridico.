<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<title>Créditos / Cobranzas - SysJuridico</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<link rel="icon" type="image/x-icon" href="/img/logo.ico" />
<link rel="icon" type="image/jpeg" href="/img/logo.jpg" />
<link rel="stylesheet" href="/css/styles.css" />
</head>
<body>
  <div class="barra-lateral" id="barra-lateral"></div>

  <div class="contenido">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:16px">
      <h2>Créditos / Cobranzas</h2>
      <button class="btn-primario" onclick="abrirModalCredito()">+ Nuevo crédito</button>
    </div>

    <div class="tarjeta">
      <input id="buscador" placeholder="Buscar por cliente, expediente o concepto..." oninput="pintarTabla()" />
    </div>

    <div class="tarjeta">
      <table>
        <thead><tr><th>Cliente</th><th>Expediente</th><th>Concepto</th><th>Monto total</th><th>Saldo</th><th>Estado</th><th>Acciones</th></tr></thead>
        <tbody id="tablaCreditos"></tbody>
      </table>
    </div>
  </div>

  <div class="modal-fondo oculto" id="modalCredito">
    <div class="modal">
      <h3 id="tituloModalCredito">Nuevo crédito</h3>
      <input type="hidden" id="creditoId" />
      <label>Cliente</label>
      <select id="crCliente"></select>
      <label style="margin-top:10px">Expediente</label>
      <select id="crExpediente"><option value="">— Sin expediente —</option></select>
      <label style="margin-top:10px">Concepto</label>
      <input id="crConcepto" placeholder="Ej: Saldo honorarios / Informconf" />
      <label style="margin-top:10px">Monto total (Gs.)</label>
      <input type="number" id="crMontoTotal" min="0" />
      <label style="margin-top:10px">Saldo pendiente (Gs.)</label>
      <input type="number" id="crSaldoPendiente" min="0" />
      <div style="display:flex; gap:10px; margin-top:16px">
        <button class="btn-primario" onclick="guardarCredito()">Guardar</button>
        <button class="btn-secundario" onclick="cerrarModalCredito()">Cancelar</button>
      </div>
    </div>
  </div>

  <div class="modal-fondo oculto" id="modalCobro">
    <div class="modal" style="max-width:440px">
      <h3>Registrar cobro</h3>
      <p id="cobroInfo" style="background:#eef3fa; border-radius:8px; padding:10px; font-size:.85rem; margin:0 0 12px"></p>
      <label>Monto a cobrar (Gs.)</label>
      <input type="number" id="cbMonto" min="0" />
      <label style="margin-top:10px">Fecha del cobro</label>
      <input type="date" id="cbFecha" />
      <label style="margin-top:10px">Método de pago</label>
      <select id="cbMetodo">
        <option value="efectivo">Efectivo</option>
        <option value="transferencia">Transferencia</option>
        <option value="tarjeta">Tarjeta</option>
        <option value="cheque">Cheque</option>
        <option value="otro">Otro</option>
      </select>
      <label style="margin-top:10px">Nota (opcional)</label>
      <input id="cbNota" placeholder="Observaciones del cobro" />
      <div style="display:flex; gap:10px; margin-top:16px">
        <button class="btn-primario" onclick="confirmarCobro()">Confirmar cobro</button>
        <button class="btn-secundario" onclick="cerrarModalCobro()">Cancelar</button>
      </div>
    </div>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/creditos.js"></script>
</body>
</html>
