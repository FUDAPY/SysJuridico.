<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<title>Equipo & Usuarios - SysJurídico</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<link rel="icon" type="image/x-icon" href="/img/logo.ico" />
<link rel="icon" type="image/jpeg" href="/img/logo.jpg" />
<link rel="stylesheet" href="/css/styles.css" />
</head>
<body>
  <div class="barra-lateral" id="barra-lateral"></div>

  <div class="contenido">
    <div class="topbar-operativa">
      <div class="topbar-titulo">
        <h2>Equipo y Control de Acceso</h2>
        <div class="topbar-subtitulo">Administración de usuarios, abogados del estudio y niveles de permisos</div>
      </div>
      <div class="topbar-acciones">
        <button class="btn-primario" onclick="abrirModalUsuario()">
          <span>+</span> Nuevo Usuario
        </button>
      </div>
    </div>

    <div class="tarjeta">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:12px">
        <h3 style="margin:0">Usuarios Registrados</h3>
        <span style="font-size:0.82rem; color:var(--texto-muted)">Perfiles con acceso al sistema</span>
      </div>
      <div style="overflow-x:auto">
        <table>
          <thead>
            <tr>
              <th>Nombre de Usuario</th>
              <th>Correo Electrónico</th>
              <th>Rol / Nivel</th>
              <th>Estado de Cuenta</th>
              <th style="text-align:right">Acciones</th>
            </tr>
          </thead>
          <tbody id="tablaUsuarios"></tbody>
        </table>
      </div>
    </div>
  </div>

  <div class="modal-fondo oculto" id="modalUsuario">
    <div class="modal">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:16px">
        <h3 style="margin:0">Crear Usuario del Estudio</h3>
        <button onclick="cerrarModalUsuario()" style="background:transparent; border:none; font-size:1.3rem; cursor:pointer; color:var(--texto-muted)">&times;</button>
      </div>
      
      <label>Nombre y Apellido</label>
      <input id="uNombre" placeholder="Ej: Dr. Fernando Benítez" />
      
      <label style="margin-top:12px">Correo Electrónico Corporativo</label>
      <input type="email" id="uEmail" placeholder="abogado@lingroup.com" />
      
      <label style="margin-top:12px">Contraseña de Acceso</label>
      <input type="password" id="uPassword" placeholder="Mínimo 6 caracteres" />
      
      <label style="margin-top:12px">Rol de Usuario</label>
      <select id="uRol">
        <option value="abogado">Abogado (Acceso a casos asignados y agenda)</option>
        <option value="admin">Administrador (Acceso total y financiero)</option>
      </select>
      
      <div style="display:flex; justify-content:flex-end; gap:10px; margin-top:20px">
        <button class="btn-secundario" onclick="cerrarModalUsuario()">Cancelar</button>
        <button class="btn-primario" onclick="guardarUsuario()">Crear Usuario</button>
      </div>
    </div>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/usuarios.js"></script>
</body>
</html>
